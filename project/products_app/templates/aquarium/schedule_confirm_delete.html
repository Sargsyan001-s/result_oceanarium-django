{% extends 'base.html' %}
{% load static %}

{% block title_name %}
Удаление позиции {{ schedule.name }}
{% endblock %}

{% block content %}
<h1>Удалить позицию "{{ schedule.name }}"?</h1>
<form method="post" class="delete-form">
    {% csrf_token %}
    <button type="submit" class="btn btn-delete">Удалить</button>
    <a href="{% url 'schedule_list' %}" class="btn btn-secondary">Вернуться к расписанию</a>
</form>
{% endblock %}
