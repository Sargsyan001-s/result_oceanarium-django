{% extends 'base.html' %}
{% load static %}

{% block title_name %}
Океанариум - Категории
{% endblock %}

{% block content %}
<h1>Категории товаров</h1>
<a href="{% url 'category_create' %}" class="btn">Добавить новую позицию</a>
<ul>
    {% for category in category_list %}
    <li>
        <a href="{% url 'category_detail' category.pk %}">{{ category.name }}</a>
        <a href="{% url 'category_update' category.pk %}">Редактировать</a>
        <a href="{% url 'category_delete' category.pk %}">Удалить</a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
