{% extends 'base.html' %}
{% load static %}

{% block title_name %}
Океанариум - Контакты
{% endblock %}

{% block content %}
<h1>Свяжитесь с нами</h1>
<div class="detail-box">
    <p><strong>Телефон:</strong> +7 (999) 123-45-67</p>
    <p><strong>Email:</strong> info@oceanarium2026.ru</p>
    <p><strong>Отдел бронирования:</strong> booking@oceanarium2026.ru</p>
</div>
<h2>Напишите нам</h2>
<form action="#" method="POST">
    <p><input type="text" name="name" placeholder="Ваше имя" required></p>
    <p><input type="email" name="email" placeholder="Ваш Email" required></p>
    <p><textarea name="message" placeholder="Ваше сообщение" rows="5" required></textarea></p>
    <button type="submit" class="btn">Отправить</button>
</form>
{% endblock %}
