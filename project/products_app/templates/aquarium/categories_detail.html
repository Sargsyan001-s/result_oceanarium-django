{% extends 'base.html' %}
{% load static %}

{% block title_name %}
{{ category.name }}
{% endblock %}

{% block content %}
<h1>{{ category.name }}</h1>
<div class="detail-box">
    <p>{{ category.description }}</p>
    <div class="detail-actions">
        <a href="{% url 'category_update' category.pk %}" class="btn">Редактировать</a>
        <a href="{% url 'category_delete' category.pk %}" class="btn btn-delete">Удалить</a>
        <a href="{% url 'category_list' %}" class="btn btn-secondary">Вернуться к списку категорий</a>
    </div>
</div>
{% endblock %}
