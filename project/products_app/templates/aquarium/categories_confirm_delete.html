{% extends 'base.html' %}
{% load static %}

{% block title_name %}
Удаление позиции {{ category.name }}
{% endblock %}

{% block content %}
<h1>Удалить позицию "{{ category.name }}"?</h1>
<form method="post" class="delete-form">
    {% csrf_token %}
    <button type="submit" class="btn btn-delete">Удалить</button>
    <a href="{% url 'category_list' %}" class="btn btn-secondary">Вернуться к списку категорий</a>
</form>
{% endblock %}
