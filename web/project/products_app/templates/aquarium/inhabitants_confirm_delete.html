{% extends 'base.html' %}
{% load static %}

{% block title_name %}
Удаление позиции {{ inhabitant.name }}
{% endblock %}

{% block content %}
<h1>Удалить позицию "{{ inhabitant.name }}"?</h1>
<form method="post" class="delete-form">
    {% csrf_token %}
    <button type="submit" class="btn btn-delete">Удалить</button>
    <a href="{% url 'inhabitant_list' %}" class="btn btn-secondary">Вернуться к списку обитателей</a>
</form>
{% endblock %}
